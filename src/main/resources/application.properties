spring.application.name=rag

# ===== 服务端口 =====
server.port=8081
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===== HSQLDB 文件数据库 =====
# 数据落在项目目录的 data/ 下，重启不丢；已加入 .gitignore
# 为什么不用 H2：H2 2.x 打开一个已存在的库时会调用
#   org.h2.store.fs.FileUtils.canWrite(file)
#   → FilePathDisk.canWrite() → java.nio.file.Files.isWritable(path)
# 一旦返回 false，H2 就强行 setProperty("ACCESS_MODE_DATA","r")，把库变成只读，
# 之后任何 insert 都报 "The database is read only ... [90097]"。
# 而部分受限环境（含本机沙箱）下 Files.isWritable() 对任何路径恒为 false，
# 于是「新建的库第一次能写，关掉再打开就只读」。HSQLDB 没有这个检查，所以换掉。
spring.datasource.url=jdbc:hsqldb:file:./data/ragdb
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=

# 建表交给 Hibernate 自动完成（学习项目够用；生产应改用 Flyway）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# 数据库控制台：HSQLDB 没有 Spring Boot 内置控制台，如需手工查表可用
# 项目里自带的 SqlTool（java -cp .../hsqldb-2.7.4.jar org.hsqldb.cmdline.SqlTool）
# 或者直接用 Hibernate 日志看 SQL（打开下面这行会打印所有执行的 SQL）
# spring.jpa.show-sql=true

# ===== 上传文件大小限制 =====
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== 可选：把私密配置放到 application-local.properties =====
# 该文件已被 .gitignore 排除，用来放 API Key
spring.config.import=optional:file:./application-local.properties

# ===== RAG 业务配置（第 2 步起生效） =====
# embedding 提供方：fake = 本地假向量（无需联网/Key）；real = 调用在线 API
rag.embedding.provider=fake
rag.embedding.base-url=https://api.siliconflow.cn/v1
rag.embedding.model=BAAI/bge-m3
rag.embedding.api-key=
rag.embedding.dimension=1024

# 切块参数
rag.chunk.size=500
rag.chunk.overlap=100

# 检索参数
rag.retrieval.top-k=5
rag.retrieval.min-score=0.2

# 生成模型（DeepSeek）
rag.llm.base-url=https://api.deepseek.com/v1
rag.llm.model=deepseek-chat
rag.llm.api-key=
rag.llm.temperature=0.2
rag.llm.max-tokens=1500
rag.llm.timeout-seconds=60

# 日志级别
logging.level.com.example.rag=INFO
