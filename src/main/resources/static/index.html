<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 知识库</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --line: #e4e7ec;
    --line-strong: #d0d5dd;
    --text: #1a1d21;
    --text-dim: #667085;
    --text-faint: #98a2b3;
    --accent: #1f6feb;
    --accent-soft: #eaf2ff;
    --ok: #12805c;
    --warn: #b54708;
    --warn-soft: #fff8eb;
    --danger: #c03830;
    --radius: 10px;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 整体布局 ---------- */
  .app {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- 左栏：知识库 ---------- */
  .sidebar {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--line);
    min-height: 0;
  }

  .brand {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
  }
  .brand h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .brand .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok);
    flex: none;
  }
  .dot.bad { background: var(--danger); }

  /* 添加资料区 */
  .add-box { padding: 14px 16px; border-bottom: 1px solid var(--line); }

  .tabs {
    display: flex;
    gap: 2px;
    background: #f1f3f6;
    padding: 3px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .tab {
    flex: 1;
    padding: 6px 0;
    border: 0;
    background: transparent;
    border-radius: 6px;
    font: inherit;
    font-size: 12.5px;
    color: var(--text-dim);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: var(--panel);
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(16,24,40,.08);
  }

  .pane { display: none; }
  .pane.active { display: block; }

  .drop {
    border: 1.5px dashed var(--line-strong);
    border-radius: var(--radius);
    padding: 20px 12px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .drop strong { display: block; color: var(--text); font-size: 13px; margin-bottom: 2px; }
  .drop.over strong { color: var(--accent); }

  .field { margin-bottom: 8px; }
  .field label {
    display: block;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  input[type=text], input[type=url], textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--panel);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(31,111,235,.12);
  }
  textarea { resize: vertical; min-height: 74px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1px solid transparent;
    border-radius: 7px;
    font: inherit;
    font-size: 13px;
    font-weight: 550;
    cursor: pointer;
    transition: background .15s, border-color .15s, opacity .15s;
    background: var(--accent);
    color: #fff;
    width: 100%;
  }
  .btn:hover:not(:disabled) { background: #1a5fd0; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost {
    background: var(--panel);
    color: var(--text);
    border-color: var(--line-strong);
    width: auto;
    font-weight: 500;
    padding: 5px 10px;
    font-size: 12px;
  }
  .btn.ghost:hover:not(:disabled) { background: #f1f3f6; }

  /* 文档列表 */
  .docs {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px 20px;
    min-height: 0;
  }
  .docs-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 4px 6px 8px;
  }
  .docs-head h2 {
    margin: 0;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .docs-head span { font-size: 11.5px; color: var(--text-faint); }

  .doc {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 9px 10px;
    border-radius: 8px;
    transition: background .12s;
  }
  .doc:hover { background: #f6f8fa; }
  .doc-icon {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .doc-icon.url { background: #eef7ee; color: var(--ok); }
  .doc-icon.text { background: #fdf3e7; color: var(--warn); }
  .doc-main { flex: 1; min-width: 0; }
  .doc-title {
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .doc-meta { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .doc-del {
    flex: none;
    border: 0;
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 5px;
    font-size: 15px;
    line-height: 1;
    opacity: 0;
    transition: opacity .12s, color .12s, background .12s;
  }
  .doc:hover .doc-del { opacity: 1; }
  .doc-del:hover { color: var(--danger); background: #fdf0ef; }

  .empty {
    padding: 26px 14px;
    text-align: center;
    font-size: 12.5px;
    color: var(--text-faint);
    line-height: 1.8;
  }

  /* ---------- 右栏：对话 ---------- */
  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px 0 8px;
    min-height: 0;
  }
  .chat-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .welcome {
    text-align: center;
    padding: 8vh 0 0;
    color: var(--text-dim);
  }
  .welcome h2 {
    margin: 0 0 8px;
    font-size: 20px;
    font-weight: 620;
    color: var(--text);
    letter-spacing: -0.015em;
  }
  .welcome p { margin: 0 0 22px; font-size: 13.5px; }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 520px;
    margin: 0 auto;
  }
  .chip {
    padding: 7px 13px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--panel);
    font: inherit;
    font-size: 12.5px;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .msg { margin-bottom: 22px; }
  .msg-role {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .03em;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .msg.user .msg-body {
    background: var(--accent-soft);
    border: 1px solid #d6e6ff;
    border-radius: var(--radius);
    padding: 11px 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.assistant .msg-body {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
  }
  .msg.warn .msg-body {
    background: var(--warn-soft);
    border: 1px solid #f5e0b8;
    border-radius: var(--radius);
    padding: 11px 14px;
    color: #6b4009;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 引用来源 */
  .sources { margin-top: 12px; }
  .sources-title {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .03em;
    color: var(--text-faint);
    margin-bottom: 7px;
  }
  .src {
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 6px;
    background: var(--panel);
    overflow: hidden;
  }
  .src-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 11px;
    cursor: pointer;
    transition: background .12s;
    user-select: none;
  }
  .src-head:hover { background: #f6f8fa; }
  .src-num {
    flex: none;
    width: 19px; height: 19px;
    border-radius: 5px;
    display: grid;
    place-items: center;
    font-size: 10.5px;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
  }
  .src-name {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .src-score {
    flex: none;
    font-size: 11px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .src-caret {
    flex: none;
    color: var(--text-faint);
    font-size: 10px;
    transition: transform .15s;
  }
  .src.open .src-caret { transform: rotate(90deg); }
  .src-body {
    display: none;
    padding: 0 11px 10px;
    font-size: 12.5px;
    color: var(--text-dim);
    white-space: pre-wrap;
    word-break: break-word;
    border-top: 1px solid var(--line);
    padding-top: 9px;
    max-height: 220px;
    overflow-y: auto;
  }
  .src.open .src-body { display: block; }

  /* 输入区 */
  .composer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 24px 16px;
    flex: none;
  }
  .composer-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 9px;
    align-items: flex-end;
  }
  .composer textarea {
    flex: 1;
    min-height: 44px;
    max-height: 160px;
    padding: 11px 13px;
    resize: none;
    line-height: 1.5;
  }
  .send {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 8px;
    border: 0;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .15s, opacity .15s;
  }
  .send:hover:not(:disabled) { background: #1a5fd0; }
  .send:disabled { opacity: .45; cursor: not-allowed; }
  .composer-hint {
    max-width: 760px;
    margin: 7px auto 0;
    font-size: 11px;
    color: var(--text-faint);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  /* 加载中 */
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-faint);
    animation: bounce 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* 提示条 */
  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: #1a1d21;
    color: #fff;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 12.5px;
    box-shadow: 0 6px 20px rgba(16,24,40,.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 100;
    max-width: 80vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: #9b2c22; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb {
    background: #d3d8e0;
    border-radius: 5px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: #b8bfca; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar {
      border-right: 0;
      border-bottom: 1px solid var(--line);
      max-height: 44vh;
    }
    .docs { max-height: 22vh; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ 左栏：知识库管理 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <h1>RAG 知识库</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">正在连接后端…</span>
      </div>
    </div>

    <div class="add-box">
      <div class="tabs">
        <button class="tab active" data-pane="file">文件</button>
        <button class="tab" data-pane="url">网页</button>
        <button class="tab" data-pane="text">文本</button>
      </div>

      <!-- 文件 -->
      <div class="pane active" id="pane-file">
        <div class="drop" id="drop">
          <strong>点击选择文件</strong>
          或拖进来 · PDF / DOCX / TXT / MD / CSV / JSON
        </div>
        <input type="file" id="fileInput" hidden
               accept=".pdf,.docx,.txt,.md,.markdown,.csv,.json,.log">
      </div>

      <!-- 网页 -->
      <div class="pane" id="pane-url">
        <div class="field">
          <label for="urlInput">网页地址</label>
          <input type="url" id="urlInput" placeholder="https://example.com/article">
        </div>
        <button class="btn" id="urlBtn">抓取并入库</button>
      </div>

      <!-- 文本 -->
      <div class="pane" id="pane-text">
        <div class="field">
          <label for="textTitle">标题（可留空）</label>
          <input type="text" id="textTitle" placeholder="我的笔记">
        </div>
        <div class="field">
          <label for="textBody">内容</label>
          <textarea id="textBody" placeholder="把要入库的文字粘贴到这里…"></textarea>
        </div>
        <button class="btn" id="textBtn">保存到知识库</button>
      </div>
    </div>

    <div class="docs">
      <div class="docs-head">
        <h2>已入库资料</h2>
        <span id="docCount">0 份</span>
      </div>
      <div id="docList"></div>
    </div>
  </aside>

  <!-- ============ 右栏：对话 ============ -->
  <main class="main">
    <div class="chat" id="chat">
      <div class="chat-inner" id="chatInner">
        <div class="welcome" id="welcome">
          <h2>向你的知识库提问</h2>
          <p>先在左边添加资料，然后在这里提问。回答会标注引用了哪些片段。</p>
          <div class="chips">
            <button class="chip">数据库索引 B+ 树</button>
            <button class="chip">进程和线程的区别</button>
            <button class="chip">RAG 是什么</button>
          </div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="question" rows="1"
                  placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send" id="sendBtn" title="发送">↑</button>
      </div>
      <div class="composer-hint">
        <span id="hintLeft">检索 Top-K：默认 5</span>
        <span id="hintRight"></span>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);

  /* ---------------- 小工具 ---------------- */

  let toastTimer = null;
  function toast(msg, isError) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast' + (isError ? ' err' : ''); }, 3200);
  }

  /** 统一处理后端返回：非 2xx 时把后端的 message 抽出来抛出。 */
  async function api(url, options) {
    const resp = await fetch(url, options);
    const text = await resp.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { /* 非 JSON 就原样返回 */ }
    if (!resp.ok) {
      const msg = (data && data.message) || text || ('HTTP ' + resp.status);
      throw new Error(msg);
    }
    return data;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function formatTime(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch (_) { return ''; }
  }

  /* ---------------- 健康检查 ---------------- */

  async function checkHealth() {
    try {
      const d = await api('/api/health');
      $('dot').classList.remove('bad');
      $('statusText').textContent = '后端正常 · ' + new Date(d.time).toLocaleTimeString('zh-CN');
    } catch (_) {
      $('dot').classList.add('bad');
      $('statusText').textContent = '后端无响应';
    }
  }

  /* ---------------- 标签页切换 ---------------- */

  document.querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
      document.querySelectorAll('.pane').forEach((p) => p.classList.remove('active'));
      tab.classList.add('active');
      $('pane-' + tab.dataset.pane).classList.add('active');
    });
  });

  /* ---------------- 文档列表 ---------------- */

  const TYPE_LABEL = { FILE: '文件', URL: '网页', TEXT: '文本' };
  const TYPE_CLASS = { FILE: '', URL: 'url', TEXT: 'text' };

  function docIconText(d) {
    if (d.sourceType === 'URL') return 'URL';
    if (d.sourceType === 'TEXT') return 'TXT';
    const name = (d.title || '').toLowerCase();
    const dot = name.lastIndexOf('.');
    const ext = dot >= 0 ? name.slice(dot + 1).toUpperCase() : 'FILE';
    return ext.slice(0, 4);
  }

  async function loadDocuments() {
    try {
      const docs = await api('/api/documents');
      $('docCount').textContent = docs.length + ' 份';
      const list = $('docList');

      if (!docs.length) {
        list.innerHTML = '<div class="empty">还没有资料<br>用上面的「文件 / 网页 / 文本」添加</div>';
        return;
      }

      list.innerHTML = docs.map((d) => `
        <div class="doc" data-id="${d.id}">
          <div class="doc-icon ${TYPE_CLASS[d.sourceType] || ''}">${esc(docIconText(d))}</div>
          <div class="doc-main">
            <div class="doc-title" title="${esc(d.title)}">${esc(d.title)}</div>
            <div class="doc-meta">${esc(TYPE_LABEL[d.sourceType] || d.sourceType)}
              · ${d.chunkCount} 段 · ${formatTime(d.createdAt)}</div>
          </div>
          <button class="doc-del" data-del="${d.id}" title="删除">×</button>
        </div>
      `).join('');

      list.querySelectorAll('[data-del]').forEach((btn) => {
        btn.addEventListener('click', () => deleteDocument(btn.dataset.del));
      });
    } catch (e) {
      $('docList').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
    }
  }

  async function deleteDocument(id) {
    if (!confirm('确定删除这份资料？它会被彻底移除。')) return;
    try {
      await api('/api/documents/' + id, { method: 'DELETE' });
      toast('已删除');
      loadDocuments();
    } catch (e) {
      toast('删除失败：' + e.message, true);
    }
  }

  /* ---------------- 上传文件 ---------------- */

  const drop = $('drop');
  const fileInput = $('fileInput');

  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) uploadFile(fileInput.files[0]);
    fileInput.value = '';
  });

  ['dragenter', 'dragover'].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) uploadFile(f);
  });

  async function uploadFile(file) {
    const form = new FormData();
    form.append('file', file);
    const old = drop.innerHTML;
    drop.innerHTML = '<strong>正在解析并向量化…</strong>' + esc(file.name);
    try {
      const r = await api('/api/documents/upload', { method: 'POST', body: form });
      toast('已入库：' + r.title + '（' + r.chunkCount + ' 段）');
      loadDocuments();
    } catch (e) {
      toast('上传失败：' + e.message, true);
    } finally {
      drop.innerHTML = old;
    }
  }

  /* ---------------- 网页入库 ---------------- */

  $('urlBtn').addEventListener('click', async () => {
    const url = $('urlInput').value.trim();
    if (!url) { toast('请先填写网页地址', true); return; }
    const btn = $('urlBtn');
    btn.disabled = true;
    btn.textContent = '抓取中…';
    try {
      const r = await api('/api/documents/url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      toast('已入库：' + r.title + '（' + r.chunkCount + ' 段）');
      $('urlInput').value = '';
      loadDocuments();
    } catch (e) {
      toast('抓取失败：' + e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = '抓取并入库';
    }
  });

  /* ---------------- 文本入库 ---------------- */

  $('textBtn').addEventListener('click', async () => {
    const text = $('textBody').value.trim();
    if (!text) { toast('内容不能为空', true); return; }
    const title = $('textTitle').value.trim();
    const btn = $('textBtn');
    btn.disabled = true;
    btn.textContent = '保存中…';
    try {
      const r = await api('/api/documents/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title || null, text })
      });
      toast('已入库：' + r.title + '（' + r.chunkCount + ' 段）');
      $('textTitle').value = '';
      $('textBody').value = '';
      loadDocuments();
    } catch (e) {
      toast('保存失败：' + e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = '保存到知识库';
    }
  });

  /* ---------------- 对话 ---------------- */

  const chat = $('chat');
  const chatInner = $('chatInner');
  const question = $('question');
  const sendBtn = $('sendBtn');
  let busy = false;

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addMessage(role, text) {
    const welcome = $('welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const label = role === 'user' ? '你' : (role === 'warn' ? '提示' : '回答');
    div.innerHTML = '<div class="msg-role">' + label + '</div>'
      + '<div class="msg-body">' + esc(text) + '</div>';
    chatInner.appendChild(div);
    scrollToBottom();
    return div;
  }

  function addLoading() {
    const welcome = $('welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = '<div class="msg-role">回答</div>'
      + '<div class="msg-body"><span class="typing"><i></i><i></i><i></i></span></div>';
    chatInner.appendChild(div);
    scrollToBottom();
    return div;
  }

  /** 把来源列表渲染成可折叠的卡片。 */
  function renderSources(container, sources) {
    if (!sources || !sources.length) return;

    const wrap = document.createElement('div');
    wrap.className = 'sources';

    const title = document.createElement('div');
    title.className = 'sources-title';
    title.textContent = '引用来源 · ' + sources.length + ' 段';
    wrap.appendChild(title);

    sources.forEach((s) => {
      const card = document.createElement('div');
      card.className = 'src';
      card.innerHTML = `
        <div class="src-head">
          <span class="src-num">${s.index}</span>
          <span class="src-name" title="${esc(s.documentTitle)}">${esc(s.documentTitle)}
            <span style="color:var(--text-faint);font-weight:400"> · 第 ${s.chunkIndex + 1} 段</span>
          </span>
          <span class="src-score">${(s.score * 100).toFixed(1)}%</span>
          <span class="src-caret">▶</span>
        </div>
        <div class="src-body">${esc(s.content)}</div>`;
      card.querySelector('.src-head').addEventListener('click', () => card.classList.toggle('open'));
      wrap.appendChild(card);
    });

    container.appendChild(wrap);
  }

  async function ask(text) {
    if (busy) return;
    const q = (text || '').trim();
    if (!q) return;

    busy = true;
    sendBtn.disabled = true;
    question.value = '';
    autoGrow();

    addMessage('user', q);
    const loading = addLoading();

    try {
      const r = await api('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });

      loading.remove();

      const isWarn = r.usedLlm === false;
      const msg = addMessage(isWarn ? 'warn' : 'assistant', r.answer);
      renderSources(msg, r.sources);

      $('hintRight').textContent = '耗时 ' + r.elapsedMs + ' ms'
        + (isWarn ? ' · 未调用大模型' : '');
      scrollToBottom();
    } catch (e) {
      loading.remove();
      addMessage('warn', '请求失败：' + e.message);
      toast(e.message, true);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      question.focus();
    }
  }

  function autoGrow() {
    question.style.height = 'auto';
    question.style.height = Math.min(question.scrollHeight, 160) + 'px';
  }

  sendBtn.addEventListener('click', () => ask(question.value));

  question.addEventListener('input', autoGrow);
  question.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      ask(question.value);
    }
  });

  // 欢迎页的示例问题，点了直接发
  document.querySelectorAll('.chip').forEach((chip) => {
    chip.addEventListener('click', () => ask(chip.textContent));
  });

  /* ---------------- 启动 ---------------- */

  checkHealth();
  loadDocuments();
  question.focus();
})();
</script>
</body>
</html>
